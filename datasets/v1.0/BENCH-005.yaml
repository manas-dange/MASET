prompt: Allow clients to supply query parameter ?limit=N to cap the number of tasks
  returned by GET /tasks. Return all tasks when parameter is omitted.
requirements:
- GET /tasks?limit=5 returns at most 5 tasks
- GET /tasks without query params returns all tasks
